<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>도착노트 · 여행 기록</title>
<style>
  :root{color-scheme:light dark;--bg:#f5f7f8;--panel:#fff;--ink:#14262e;--muted:#5a6d75;--line:#dce5e7;--accent:#087d6c}
  @media(prefers-color-scheme:dark){:root{--bg:#10191f;--panel:#19262e;--ink:#edf6f6;--muted:#a4b6bc;--line:#34454f;--accent:#5ec8b8}}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  main{max-width:1100px;margin:auto;padding:28px 18px 48px}h1{margin:12px 0 4px;font-size:28px}p{margin:8px 0;color:var(--muted)}
  .brand{color:var(--accent);font-weight:700}.panel{margin-top:20px;border:1px solid var(--line);border-radius:16px;padding:20px;background:var(--panel)}
  .stats{display:flex;gap:28px;flex-wrap:wrap}.stats b{display:block;font-size:24px}.stats span{color:var(--muted);font-size:13px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}button{font:inherit;font-weight:600;padding:12px 18px;border-radius:10px;cursor:pointer;border:1px solid var(--line);color:var(--ink);background:var(--panel)}
  .primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:850px}
  th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:13px;color:var(--muted)}td{white-space:pre-wrap;overflow-wrap:anywhere;max-width:260px}
  .badge{display:inline-block;border-radius:6px;padding:3px 8px;background:var(--bg);font-size:13px}.warn{color:#b36c1d}.small{font-size:13px}
  @media print{:root{color-scheme:light;--bg:#fff;--panel:#fff;--ink:#000;--muted:#333;--line:#aaa}button,.privacy{display:none}.panel{border:0;padding:0}.scroll{overflow:visible}table{min-width:0;font-size:10px}th,td{padding:5px}}
</style>
</head>
<body>
<main>
  <span class="brand">도착노트 / 여행 기록</span>
  <h1 id="title">여행 기록을 여는 중…</h1>
  <p id="status" role="status"></p>
  <div id="content" hidden>
    <section class="panel">
      <div class="stats">
        <div><b id="count"></b><span>이 파일의 방문 기록</span></div>
        <div><b id="favorites"></b><span>이 파일의 다시 갈 곳</span></div>
        <div><b id="distance"></b><span>전체 여행의 수집 GPS 거리</span></div>
      </div>
      <p id="part"></p>
      <p id="snapshot" class="small"></p>
      <div class="actions">
        <button id="csv" class="primary">엑셀에서 열 수 있는 CSV 저장</button>
        <button id="print">인쇄 · PDF</button>
      </div>
      <p id="sample" class="warn" hidden>예시 여행이에요. 실제 방문 기록이 아닙니다.</p>
    </section>
    <section class="panel">
      <div class="scroll"><table>
        <thead><tr><th>순서</th><th>장소 · 주소</th><th>도착 · 출발</th><th>체류</th><th>다시 갈 곳</th><th>메모</th><th>GPS 좌표</th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </section>
    <p class="privacy small">기록은 이 링크의 # 뒤에 담겨 있으며 이 페이지에서만 처리돼요. CSV에는 방문 장소의 좌표가 포함돼요. 원시 이동 경로는 포함하지 않아요. 내려받거나 공유한 사본은 차량에서 동의를 철회해도 지워지지 않아요.</p>
  </div>
</main>
<script type="module">
const $ = id => document.getElementById(id);
// Reusing the same phone tab for the next QR must replace the previously displayed records.
window.addEventListener('hashchange', () => location.reload());
try {
  const {decodeJourney, formatDate, visitRows, buildCsv, exportFilename} = await import('./journey-export.mjs?v=20261106c');
  const data = await decodeJourney(location.hash.slice(1));
  document.title = `${data.title} · 도착노트 여행 기록`;
  $('title').textContent = data.title;
  $('status').textContent = `${formatDate(data.startedAt,data.zone)} 출발 · ${data.endedAt === null ? '여행 중' : formatDate(data.endedAt,data.zone)+' 종료'}`;
  $('count').textContent = `${data.stops.length}곳`;
  $('favorites').textContent = `${data.stops.filter(s=>s[6]).length}곳`;
  $('distance').textContent = `${data.km.toFixed(1)} km`;
  $('part').textContent = data.parts > 1 ? `전체 ${data.total}개 방문 중 ${data.offset+1}~${data.offset+data.stops.length}번 · ${data.part}/${data.parts}번째 파일입니다. 모든 QR을 스캔해 각각 저장해 주세요.` : `전체 ${data.total}개 방문 기록`;
  $('snapshot').textContent = `${formatDate(data.exportedAt,data.zone)} 기준 · ${data.zone} · 머무는 중인 방문은 이 시점까지 계산했어요. 기록 중단 방문의 체류 시간은 알 수 없어요.`;
  $('sample').hidden = !data.sample;
  for (const row of visitRows(data)) {
    const tr=document.createElement('tr');
    const cells=[row[6], [row[7]||'이름 없는 방문',row[8]].filter(Boolean).join('\n'), [row[9],row[10]||row[12]].join('\n'),row[11]===''?'알 수 없음':`${row[11]}분`,row[13],row[14],row[15]===null?'없음':`${row[15]}, ${row[16]}`];
    for(const value of cells){const td=document.createElement('td');td.textContent=String(value);tr.append(td);}
    $('rows').append(tr);
  }
  $('csv').addEventListener('click',()=>{
    const url=URL.createObjectURL(new Blob([buildCsv(data)],{type:'text/csv;charset=utf-8'}));
    const a=document.createElement('a');a.href=url;a.download=exportFilename(data);document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  });
  $('print').addEventListener('click',()=>window.print());
  $('content').hidden=false;
} catch {
  $('title').textContent='여행 기록을 읽지 못했어요';
  $('status').textContent='차량 화면의 QR을 다시 스캔해 주세요. 계속 열리지 않으면 최신 브라우저를 사용하거나 차량에서 CSV 파일로 저장해 주세요.';
}
</script>
</body>
</html>
