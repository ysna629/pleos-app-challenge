<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>Route94 · 기록</title>
<style>
:root{color-scheme:light dark;--bg:#f3f6f5;--card:#fff;--ink:#17332f;--muted:#60736e;--line:#dce6e2;--accent:#147a67}
@media(prefers-color-scheme:dark){:root{--bg:#101b20;--card:#1b2b31;--ink:#edf5f1;--muted:#a5b9b1;--line:#34474b;--accent:#79d6bc}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}main{max-width:560px;margin:auto;padding:28px 20px 60px}h1{font-size:30px;line-height:1.3;margin:10px 0 4px;overflow-wrap:anywhere}p{margin:6px 0;overflow-wrap:anywhere}.brand{color:var(--accent);font-weight:700}.muted{color:var(--muted);font-size:14px}.card{padding:22px;margin:18px 0;background:var(--card);border:1px solid var(--line);border-radius:18px}dl{display:grid;grid-template-columns:max-content 1fr;gap:8px 18px;margin:0}dt{color:var(--muted)}dd{margin:0}h2{font-size:15px;color:var(--muted);font-weight:600;margin:26px 0 10px}.buttons{display:grid;gap:10px}.btn{display:block;padding:14px 16px;border-radius:12px;text-align:center;text-decoration:none;font-weight:700;border:1px solid var(--line);color:var(--ink);background:var(--card);font-size:16px;cursor:pointer}.btn.first{background:var(--accent);color:#0e1b19;border-color:var(--accent)}.btn.sms{background:#1f7aec;color:#fff;border-color:#1f7aec}.privacy{border-top:1px solid var(--line);padding-top:18px;margin-top:30px}
</style>
</head>
<body><main>
<div class="brand">Route94</div>
<h1 id="title">기록을 여는 중…</h1>
<p id="status" class="muted" role="status"></p>
<div class="card" id="card" hidden><dl id="facts"></dl></div>
<section id="maps" hidden><h2>지도에서 열기</h2><div class="buttons" id="mapButtons"></div><p class="muted">저장된 주차 좌표를 열어요. 실제 입구와 다를 수 있어요.</p></section>
<section id="keep" hidden><h2>내 휴대폰에 남기기</h2><div class="buttons"><a class="btn sms" id="sms">문자로 보내기</a><button class="btn" id="copy">내용 복사</button></div><p class="muted" id="smsNote"></p></section>
<p class="muted privacy">기록은 QR 링크 안에 담겨 있고 서버에 올라가지 않아요. 지도 버튼을 누르면 좌표가 그 지도 서비스로 전달돼요. 이 페이지는 차량의 동의 철회로 지워지지 않아요.</p>
</main>
<script type="module">
const $=id=>document.getElementById(id);
window.addEventListener('hashchange',()=>location.reload());
try{
 const {decodeRecord,formatDate,km,mapLinks,smsBody,smsHref,purposeLabel}=await import('./record.mjs?v=20261110');
 const data=await decodeRecord(location.hash.slice(1));
 const trip=data.k==='trip';
 $('title').textContent=data.spot||(trip?'주차 위치 기록 안 함':'주차 위치');
 $('status').textContent=(trip?'운행 기록 · ':'주차 위치 · ')+formatDate(data.e);
 const facts=[];
 if(data.addr)facts.push(['주소',data.addr]);
 if(trip){facts.push(['운행',`${formatDate(data.s)} → ${formatDate(data.e)}`],['계기판',`${km(data.a)} → ${km(data.b)}`],['주행거리',km(Math.max(0,data.b-data.a))],['구분',purposeLabel(data.p)]);}
 else facts.push(['주차 시각',formatDate(data.e)]);
 for(const [k,v] of facts){const dt=document.createElement('dt');dt.textContent=k;const dd=document.createElement('dd');dd.textContent=v;$('facts').append(dt,dd);}
 $('card').hidden=false;
 const links=mapLinks(data);
 if(links.length){for(const [i,l] of links.entries()){const a=document.createElement('a');a.className='btn'+(i===0?' first':'');a.href=l.href;a.rel='noopener';a.textContent=l.label+(i===0?' (기본)':'');$('mapButtons').append(a);}$('maps').hidden=false;}
 $('sms').href=smsHref(data,undefined,navigator.userAgent);
 $('smsNote').textContent=data.ph?'문자 앱이 열리면 보내기만 누르세요. 받는 사람은 내 번호예요.':'문자 앱이 열리면 받는 사람에 내 번호를 넣고 보내세요. 차량 설정에 번호를 넣어 두면 자동으로 채워져요.';
 $('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(smsBody(data));$('copy').textContent='복사했어요'}catch{$('copy').textContent='복사하지 못했어요'}});
 $('keep').hidden=false;
}catch(e){$('title').textContent='기록을 읽지 못했어요';$('status').textContent='차량의 QR을 다시 스캔해 주세요. 최신 브라우저에서 열어 주세요.'}
</script>
</body></html>
